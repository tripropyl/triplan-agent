[package]
name = "triplan-agent"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight, high-performance agent runtime kernel for local-first, durable, auditable multi-agent systems."
repository = "https://github.com/tripropyl/triplan-agent"

[[bin]]
name = "triplan-agent"
path = "src/main.rs"

[lib]
name = "triplan_agent"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
dotenvy = "0.15"
predicates = "3"
tempfile = "3"
